
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahmad & Yara</title>
     <link rel="icon" type="image/png" href="/Photos/wedding-invitation.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="invitation-cover">

        <!-- =========================
             INTRO
        ========================== -->

        <div class="intro">

            <p class="small-text">
                YOU ARE INVITED
            </p>

            <h1>
                Ahmad <span>&</span> Yara
            </h1>

            <p class="date">
                6 November 2026
            </p>

        </div>


        <!-- =========================
             ENVELOPE
        ========================== -->

        <div class="envelope-container">

            <div class="envelope">

                <!-- Envelope back -->
                <div class="envelope-back"></div>


                <!-- Letter -->
                <div class="letter">

                    <p>
                        Ahmad & Yara
                    </p>

                    <small>
                        6 November 2026
                    </small>

                </div>


                <!-- Envelope front pocket -->
                <div class="envelope-front"></div>


                <!-- Envelope flap -->
                <div class="envelope-flap"></div>


                <!-- Wax seal -->
                <div class="seal">
                    A<span>&</span>Y
                </div>

            </div>

        </div>


        <!-- =========================
             OPEN BUTTON
        ========================== -->

        <button
            class="open-button"
            id="openButton"
        >
            Open Invitation
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
